name: App checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_browser_test_fixture
      NEXT_PUBLIC_APP_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      GAME_TEST_FIXTURE: 1
      VISUAL_REVIEW: ${{ github.event_name == 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Validate Cloudflare Worker build
        run: npx wrangler deploy --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-person-visuals
          path: |
            test-results/first-person-*.jpg
            test-results/first-person-*/error-context.md
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: test-results/
          retention-days: 7

  deployment-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/deployment-probe.mjs

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrate and seed isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            if [[ "$migration" == *20260912133819_tradable_bin_loot.sql ]]; then psql -v ON_ERROR_STOP=1 -f supabase/tests/loot_upgrade.sql; fi
            psql --single-transaction -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Configure bulk economy fixtures
        run: psql -v ON_ERROR_STOP=1 -c "select set_config('game.reason','CI bulk economy fixture capacity',false); update public.game_settings set value=1000000000 where key='inventory_weight_limit_grams'; update public.game_settings set value=0 where key in ('scavenging_patrol_enabled','scavenging_event_chance','scavenging_search_chase_enabled'); update public.game_bin_rules set bandages_blueprint_chance=0;"
      - name: Economic and authorization regression tests
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/player_economy.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/seasons.sql

          psql -v ON_ERROR_STOP=1 -f supabase/tests/social.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/city_layout.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/districts.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/telegrams.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/telegram_groups.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/market_auctions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/mining.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bin_diving.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/scavenging.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/scavenging_patrols.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/tradable_loot.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/refineries.sql
      - name: Street theft, garage ownership and police combat
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/street_operations.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/first_person.sql
          bash supabase/tests/street_races.sh

      - name: Concurrent district purchase test
        run: bash supabase/tests/district_races.sh

      - name: Concurrent Telegram retry test
        run: bash supabase/tests/telegram_races.sh

      - name: Concurrent market auction bids and settlement
        run: bash supabase/tests/market_races.sh

      - name: Concurrent mining shifts and claims
        run: bash supabase/tests/mining_races.sh

      - name: Concurrent bin diving rewards and district cooldown
        run: bash supabase/tests/bin_races.sh

      - name: Concurrent patrol arrests and search collection
        run: bash supabase/tests/patrol_races.sh

      - name: Concurrent refinery purchases and fuel consumption
        run: bash supabase/tests/refinery_races.sh

      - name: National Bank transfers and concurrency
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bank.sql
          bash supabase/tests/bank_races.sh

      - name: Inventory storage security and concurrency
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/inventory.sql
          bash supabase/tests/inventory_races.sh

      - name: Equipment and actual carried capacity
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/inventory_loadout.sql
          bash supabase/tests/loadout_races.sh

      - name: Player profile privacy and persistence
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/player_profiles.sql

      - name: Gang headquarters permissions and concurrency
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/gangs.sql
          bash supabase/tests/gang_races.sh

      - name: City leases, crafting stations and tenant isolation
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/property_leases.sql
          bash supabase/tests/property_lease_races.sh

      - name: Blueprint learning and property crafting
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/crafting.sql
          bash supabase/tests/crafting_races.sh

      - name: Prison custody, release and breakouts
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/prison.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/prison_breaks.sql

      - name: Public closed-beta schedule
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/closed_beta.sql

      - name: Personal health and armour
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/vitals.sql

      - name: Bandage discovery, crafting and secure healing
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bandages.sql
          bash supabase/tests/bandage_races.sh

      - name: Player robbery security and cash-only transfers
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/robberies.sql
          bash supabase/tests/robbery_races.sh

      - name: Equipment stacking and ammunition quantities
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/equipment_stacking.sql
          bash supabase/tests/equipment_stacking_races.sh

      - name: Shooting range scoring, consumption and concurrent shots
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/shooting_range.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/m4_carbine.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/range_magazines.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/range_difficulty.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/range_score_accuracy.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/skills.sql
          bash supabase/tests/range_rewards_races.sh
          bash supabase/tests/shooting_range_races.sh
