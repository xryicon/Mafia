name: App checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_browser_test_fixture
      NEXT_PUBLIC_APP_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      GAME_TEST_FIXTURE: 1
      VISUAL_REVIEW: ${{ github.event_name == 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-checks
          path: test-results/
          retention-days: 7

  deployment-probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/deployment-probe.mjs

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrate and seed isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          for migration in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$migration"; done
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
          psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - name: Economic and authorization regression tests
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/player_economy.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/foundation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/seasons.sql

          psql -v ON_ERROR_STOP=1 -f supabase/tests/social.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/city_layout.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/districts.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/telegrams.sql
      - name: Concurrent district purchase test
        run: bash supabase/tests/district_races.sh
