name: Prepare original artwork
on:
  push:
    branches: [blackwater-visual-overhaul]
    paths: ['art-source/**', 'scripts/prepare-art.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blackwater-visual-overhaul
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false sharp@0.34.5
      - run: node scripts/prepare-art.mjs
      - name: Commit responsive artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/art
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Optimize original Blackwater artwork for desktop and mobile"
          git push origin HEAD:blackwater-visual-overhaul
